<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://api.emailjs.com; img-src 'self' data: https:;">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adjective Conjugation Practice | N5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600;700;800&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4.4.1/dist/email.min.js" integrity="sha384-SALc35EccAf6RzGw4iNsyj7kTPr33K7RoGzYu+7heZhT8s0GZouafRiCg1qy44AS" crossorigin="anonymous"></script>
<link rel="stylesheet" href="../assets/css/quiz-common.css">
</head>
<body>

<!-- Site Breadcrumb -->
<nav class="site-breadcrumb" aria-label="Breadcrumb">
  <ol class="site-breadcrumb__list">
    <li class="site-breadcrumb__item"><a class="site-breadcrumb__link" href="../../index.html">Home</a></li>
    <li class="site-breadcrumb__item"><a class="site-breadcrumb__link site-breadcrumb__category" href="../../index.html#quiz">Quiz</a></li>
    <li class="site-breadcrumb__item"><span class="site-breadcrumb__current" aria-current="page">Adjective Conjugation Quiz</span></li>
  </ol>
</nav>
<!-- End Site Breadcrumb -->

<div class="container">

  <!-- ════ NAME SCREEN ════ -->
  <div id="name-screen">
    <div class="card text-center">
      <span class="badge">My-Japanese-Reviewers</span>
      <h1 class="title">Adjective Conjugation Practice</h1>
      <p class="subtitle">27 questions · Conjugation &amp; Sentences · N5 Level</p>
      <label class="name-label">おなまえは？ Enter your name</label>
      <input class="name-input" id="name-input" type="text" placeholder="Your name..." autofocus>
      <button class="btn-primary" id="btn-start" disabled>Start Quiz →</button>
    </div>
  </div>

  <!-- ════ QUIZ SCREEN ════ -->
  <div id="quiz-screen">
    <header class="header">
      <span class="badge">My-Japanese-Reviewers</span>
      <h1 class="title">Adjective Conjugation</h1>
      <p class="subtitle" id="quiz-subtitle"></p>
    </header>

    <div class="score-banner" id="score-banner" aria-live="polite">
      <div class="score-number" id="score-number"></div>
      <div class="score-label" id="score-label"></div>
      <div class="email-row" id="email-row"></div>
      <div class="end-actions">
        <button class="btn-end" id="btn-review" disabled>📝 Review wrong answers</button>
        <button class="btn-end" id="btn-retake">🔄 Retake Quiz</button>
        <button class="btn-end" id="btn-home">🏠 Main Menu</button>
      </div>
    </div>

    <div class="review-banner" id="review-banner">
      📝 Review mode — showing only questions you got wrong
    </div>

    <div class="progress-row">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
        <span class="progress-text" id="progress-text" style="margin-bottom: 0;">0 / 27 answered</span>
        <div class="topbar-timer" id="timer-wrapper">
          <span class="timer-icon">⏳</span>
          <span class="timer-display" id="timer-display">00:00</span>
        </div>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
    </div>

    <div class="nav-grid hidden" id="nav-grid"></div>

    <div class="skipped-warning hidden" id="skipped-warning" aria-live="polite"></div>

    <div class="q-card" id="q-card">
      <div class="q-number" id="q-number"></div>
      <div class="q-text" id="q-text"></div>
      <div class="choices-grid" id="choices-grid"></div>
      <div class="feedback-card" id="feedback-card" aria-live="polite"></div>
    </div>

    <div class="arrow-row">
      <button class="btn-nav" id="btn-prev">← Previous</button>
      <button class="btn-nav" id="btn-next">Next →</button>
      <button class="btn-submit hidden" id="btn-submit" disabled>Submit Exam</button>
    </div>
  </div>

</div>

<script src="adjective-conjugation-setup.js"></script>
<script src="../assets/js/quiz-common.js"></script>
</body>
</html>
