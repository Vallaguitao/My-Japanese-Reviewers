<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:;">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Lesson Engine | Japanese Reviewers</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="Lessons/assets/css/lessons-common.css">
</head>
<body>
    <!-- Skip Link for Accessibility -->
    <a href="#slide-container" class="skip-link sr-only">Skip to lesson content</a>

    <!-- Progress Bar Navigation -->
    <div class="progress-container">
        <div class="progress-header">
            <div class="progress-title" id="progressTitle">
                <span class="lesson-badge" id="lessonBadge">L1</span>
                <span id="lessonTitle">Loading Lesson...</span>
            </div>
            <div class="progress-bar-wrapper">
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <div class="progress-text"><span id="currentSlide">1</span> / <span id="totalSlides">1</span></div>
            </div>
            <div class="progress-nav">
                <button class="nav-btn" id="prevBtn" onclick="prevSlide()">◀ <span class="btn-text">Back</span></button>
                <button class="nav-btn" id="nextBtn" onclick="nextSlide()"><span class="btn-text">Next</span> ▶</button>
            </div>
        </div>
    </div>

    <!-- Main Presentation Container -->
    <div class="presentation">
        <!-- Site Breadcrumb Navigation -->
        <nav class="site-breadcrumb" aria-label="Breadcrumb">
            <ol class="site-breadcrumb__list">
                <li class="site-breadcrumb__item"><a class="site-breadcrumb__link" href="index.html">Home</a></li>
                <li class="site-breadcrumb__item"><a class="site-breadcrumb__link site-breadcrumb__category" href="index.html#lessons">Lessons</a></li>
                <li class="site-breadcrumb__item"><span class="site-breadcrumb__current" aria-current="page" id="breadcrumbLesson">Dynamic Lesson</span></li>
            </ol>
        </nav>

        <!-- Dynamic Slide Container -->
        <div id="slide-container"></div>
    </div>

    <!-- Engine Scripts -->
    <script src="assets/js/tts-helper.js"></script>
    <script src="Lessons/data/n5_lesson_1.js"></script>
    <script src="assets/js/lesson-renderer.js"></script>
</body>
</html>
