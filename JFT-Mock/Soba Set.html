<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://api.emailjs.com; img-src 'self' data: https:;">
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>JFT Mock Exam 5 — Complete</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600;900&family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/jft-common.css">
</head>
<body>

<!-- Site Breadcrumb -->
<nav class="site-breadcrumb" aria-label="Breadcrumb">
  <ol class="site-breadcrumb__list">
    <li class="site-breadcrumb__item"><a class="site-breadcrumb__link" href="../index.html">Home</a></li>
    <li class="site-breadcrumb__item"><a class="site-breadcrumb__link site-breadcrumb__category" href="../index.html#jft-mock">JFT Mock</a></li>
    <li class="site-breadcrumb__item"><span class="site-breadcrumb__current" aria-current="page">Soba Set</span></li>
  </ol>
</nav>
<!-- End Site Breadcrumb -->


<div class="petal" style="left:8%;  animation-duration:14s; animation-delay:0s;">🌸</div>
<div class="petal" style="left:22%; animation-duration:18s; animation-delay:3s;">❀</div>
<div class="petal" style="left:42%; animation-duration:16s; animation-delay:6s;">🌸</div>
<div class="petal" style="left:66%; animation-duration:20s; animation-delay:2s;">❀</div>
<div class="petal" style="left:82%; animation-duration:15s; animation-delay:8s;">🌸</div>
<div class="petal" style="left:92%; animation-duration:17s; animation-delay:4s;">❀</div>

<div class="wrap">

  <header class="hero">
    <div class="kicker">JFT-Basic ・ A2 / N4</div>
    <h1>Mock Exam 5
      <span class="jp">そうごうもしけん ・ Complete Practice Test</span>
    </h1>
    <p class="sub">4 sets ・ 50 questions total ・ tap any tab to begin</p>
  </header>

  <!-- TABS -->
  <nav class="tabs">
    <button class="tab active" data-set="1" onclick="switchSet(1)">
      <span class="tab-num">SET 1</span>
      <span class="tab-name">語彙</span>
      <span class="tab-status" id="status-1">14 Q</span>
    </button>
    <button class="tab" data-set="2" onclick="switchSet(2)">
      <span class="tab-num">SET 2</span>
      <span class="tab-name">表現</span>
      <span class="tab-status" id="status-2">12 Q</span>
    </button>
    <button class="tab" data-set="3" onclick="switchSet(3)">
      <span class="tab-num">SET 3</span>
      <span class="tab-name">聴解</span>
      <span class="tab-status" id="status-3">12 Q</span>
    </button>
    <button class="tab" data-set="4" onclick="switchSet(4)">
      <span class="tab-num">SET 4</span>
      <span class="tab-name">読解</span>
      <span class="tab-status" id="status-4">12 Q</span>
    </button>
  </nav>

  <!-- SET CONTAINERS -->
  <div class="set active" id="set-1"></div>
  <div class="set" id="set-2"></div>
  <div class="set" id="set-3"></div>
  <div class="set" id="set-4"></div>

  <div class="grand-total" id="grand-total">
    Sets completed: <strong id="sets-done">0</strong> / 4
    ・ Total score: <strong id="total-score">0</strong> / 50
  </div>

  <footer>
    <span class="mark">❀</span> My Japanese Reviewers ・ JFT Mock Series 5 <span class="mark">❀</span>
  </footer>
</div>

<script src="soba_set_setup.js"></script>
<script src="assets/js/jft-common.js"></script>
</body>
</html>
